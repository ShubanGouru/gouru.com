<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gouru — Coming Soon</title>
    <meta name="description" content="Gouru is being rebuilt. Something new is on the way." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8f6f0;
        --text: #111111;
        --muted: #6f6a65;
        --rule: #d8d4cf;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(20px, 6vw, 48px);
        font-family: "Sora", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(92vw, 640px);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 9vw, 5rem);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .tag {
        display: inline-block;
        margin-top: clamp(18px, 3.5vw, 26px);
        padding-top: clamp(16px, 3vw, 22px);
        border-top: 1px solid var(--rule);
        font-size: clamp(1rem, 2.9vw, 1.35rem);
        font-weight: 700;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>gouru</h1>
      <span class="tag">Something new is on the way.</span>
    </main>
  </body>
</html>
