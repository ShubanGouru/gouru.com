<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shuban Gouru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8f6f0;
        --text: #111111;
        --muted: #6f6a65;
        --tile: #d8d4cf;
        --icon: #7b7671;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(20px, 6vw, 48px);
        font-family: "Sora", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(92vw, 640px);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .socials {
        margin-top: clamp(20px, 4vw, 30px);
        display: flex;
        justify-content: center;
        gap: clamp(12px, 2.6vw, 18px);
      }

      .social-link {
        width: clamp(56px, 11vw, 68px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 2px;
        background: var(--tile);
        color: var(--icon);
        text-decoration: none;
        transition: transform 160ms ease, background-color 160ms ease;
      }

      .social-link:hover {
        transform: translateY(-1px);
        background: #cbc6c0;
      }

      .social-link:focus-visible {
        outline: 2px solid #96908a;
        outline-offset: 2px;
      }

      .social-link svg {
        width: 50%;
        height: 50%;
        display: block;
      }

      p {
        margin: clamp(14px, 2.7vw, 22px) 0 0;
        font-size: clamp(1rem, 2.9vw, 1.45rem);
        font-weight: 700;
        color: var(--muted);
      }

      p a {
        color: inherit;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shuban Gouru</h1>

      <div class="socials" aria-label="Social links">
        <a
          class="social-link"
          href="https://linkedin.com/in/shubangouru"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
            <path
              d="M7 9H3.5V20H7V9ZM5.25 3.5C4.1 3.5 3.25 4.35 3.25 5.5C3.25 6.65 4.1 7.5 5.25 7.5C6.4 7.5 7.25 6.65 7.25 5.5C7.25 4.35 6.4 3.5 5.25 3.5ZM20.75 14.25C20.75 10.95 19.1 9 16.1 9C14.6 9 13.55 9.8 13 10.55V9H9.5V20H13V14.05C13 12.55 13.8 11.65 15.1 11.65C16.45 11.65 17.25 12.55 17.25 14.05V20H20.75V14.25Z"
              fill="currentColor"
            />
          </svg>
        </a>

        <a
          class="social-link"
          href="https://x.com/ShubanGouru"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="X (Twitter)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
            <path
              d="M18.9 3H21L14.55 10.4L22 21H16.2L11.65 14.55L5.9 21H3.8L10.7 13.25L3.6 3H9.55L13.65 8.95L18.9 3ZM18.15 19.35H19.3L8.95 4.55H7.7L18.15 19.35Z"
              fill="currentColor"
            />
          </svg>
        </a>

        <a
          class="social-link"
          href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ06s5hWsWB4gUfdTBgO2eTxwpdb4UxK5Q3FJ0ldn_PEV7Odhxy3o1l6M_I5mHagao-3UnAQWUBe?gv=true"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Schedule a meeting"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
            <path
              d="M7 2.75C7.41 2.75 7.75 3.09 7.75 3.5V4.5H16.25V3.5C16.25 3.09 16.59 2.75 17 2.75C17.41 2.75 17.75 3.09 17.75 3.5V4.5H19.25C20.49 4.5 21.5 5.51 21.5 6.75V18.75C21.5 19.99 20.49 21 19.25 21H4.75C3.51 21 2.5 19.99 2.5 18.75V6.75C2.5 5.51 3.51 4.5 4.75 4.5H6.25V3.5C6.25 3.09 6.59 2.75 7 2.75ZM20 9H4V18.75C4 19.16 4.34 19.5 4.75 19.5H19.25C19.66 19.5 20 19.16 20 18.75V9ZM7.25 12C7.25 11.59 7.59 11.25 8 11.25H10C10.41 11.25 10.75 11.59 10.75 12V14C10.75 14.41 10.41 14.75 10 14.75H8C7.59 14.75 7.25 14.41 7.25 14V12Z"
              fill="currentColor"
            />
          </svg>
        </a>
      </div>

      <p>
        Or email me at
        <a href="mailto:shuban@gouru.com">shuban@gouru.com</a>
      </p>
    </main>
  </body>
</html>
